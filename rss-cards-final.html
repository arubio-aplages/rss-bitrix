<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Últimas publicaciones (Final)</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --maxw: 1160px;   /* ancho máximo del bloque: AJÚSTALO si tu bloque anterior usa otra medida */
    --pad: 24px;      /* padding lateral */
    --gap: 24px;      /* separación entre tarjetas */
    --radius: 3px;
    --shadow: 0 6px 18px rgba(0,0,0,.06);
    --label: #ee7b19;   /* etiqueta naranja */
    --label-text: #fff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#fff;font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
  #rss-grid{width:100%;}
  .rss-container{
    max-width: var(--maxw);
    margin-inline: auto;
    padding-inline: var(--pad);
    padding-block: 24px;
  }
  .rss-list{
    display:grid;
    gap: var(--gap);
    grid-template-columns: repeat(4, minmax(0, 1fr));
    align-items: stretch;
  }
  @media (max-width: 1200px){ .rss-list{ grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 900px){  .rss-list{ grid-template-columns: repeat(2, 1fr); gap:20px; } }
  @media (max-width: 600px){  .rss-list{ grid-template-columns: 1fr; gap:18px; } }

  .post-card{display:flex;flex-direction:column;height:100%;
    border:1px solid rgba(0,0,0,.08);border-radius:var(--radius);
    overflow:hidden;background:#fff;box-shadow:var(--shadow);}
  .image-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#f2f4f7;overflow:hidden;}
  .image-wrap img{width:100%;height:100%;object-fit:cover;display:block;image-rendering:auto;}
  .badge{position:absolute;top:12px;right:12px;background:var(--label);color:var(--label-text);
    font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);max-width:65%;
    white-space:nowrap;text-overflow:ellipsis;overflow:hidden;}
  .content{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1;}
  .title{font-size:18px;line-height:1.25;font-weight:600;color:#0b1220;margin:0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:46px;}
  .excerpt{font-size:14px;line-height:1.55;color:#4a5568;margin:0;
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;min-height:87px;}
  .post-link{text-decoration:none;color:inherit;display:flex;flex-direction:column;height:100%;}
  .skeleton{animation:shimmer 1.2s infinite linear;
    background:linear-gradient(90deg,#eee 25%,#f7f7f7 37%,#eee 63%);background-size:400% 100%;}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
  .rss-error{color:#b00020;font-weight:500;margin-top:8px;}
</style>
</head>
<body>
<section id="rss-grid">
  <div class="rss-container">
    <div class="rss-list" role="list"></div>
    <div class="rss-error" hidden>No se pudo cargar el feed.</div>
  </div>
</section>

<script>
(async function () {
  const FEED = "https://tuasesorprofesional.com/feed.xml";
  const LIST = document.querySelector(".rss-list");
  const ERROR = document.querySelector(".rss-error");
  const MAX_POSTS = 4;

  LIST.textContent = "Cargando publicaciones…";
  ERROR.hidden = true;

  // Lee etiquetas XML sin usar selectores con dos puntos.
  function field(parent, name) {
    const element = Array.from(parent.children).find(
      el => el.localName === name
    );
    return element ? element.textContent.trim() : "";
  }

  function safeUrl(value) {
    try {
      const url = new URL(value, FEED);
      return ["https:", "http:"].includes(url.protocol)
        ? url.href : "";
    } catch {
      return "";
    }
  }

  function contentInfo(html) {
    const doc = new DOMParser().parseFromString(
      html || "", "text/html"
    );

    doc.querySelectorAll("script, style").forEach(el => el.remove());

    const text = (doc.body.textContent || "")
      .replace(/\s+/g, " ").trim();

    const words = text.split(" ").filter(Boolean);
    const img = doc.querySelector("img");

    return {
      excerpt: words.slice(0, 28).join(" ") +
        (words.length > 28 ? "…" : ""),
      image: img
        ? img.getAttribute("src") ||
          img.getAttribute("data-src") || ""
        : ""
    };
  }

  async function get(url, json = false) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 12000);

    try {
      const response = await fetch(url, {
        signal: controller.signal
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      return json ? await response.json() : await response.text();
    } finally {
      clearTimeout(timeout);
    }
  }

  function parseXML(text) {
    const xml = new DOMParser().parseFromString(
      text, "application/xml"
    );

    if (xml.getElementsByTagName("parsererror").length) {
      throw new Error("La respuesta no es un XML válido");
    }

    let entries = Array.from(xml.getElementsByTagName("item"));

    // También admite un feed Atom.
    if (!entries.length) {
      entries = Array.from(
        xml.getElementsByTagNameNS("*", "entry")
      );
    }

    if (!entries.length) {
      throw new Error("El feed no contiene artículos");
    }

    return entries.slice(0, MAX_POSTS).map(item => {
      const html = field(item, "encoded") ||
        field(item, "description") ||
        field(item, "content") ||
        field(item, "summary");

      const info = contentInfo(html);
      const children = Array.from(item.children);

      const atomLink = children.find(el =>
        el.localName === "link" &&
        el.getAttribute("href") &&
        (!el.getAttribute("rel") ||
         el.getAttribute("rel") === "alternate")
      );

      const category = children.find(
        el => el.localName === "category"
      );

      const media = Array.from(item.getElementsByTagName("*"))
        .find(el => {
          const name = el.localName;
          const type = el.getAttribute("type") || "";
          return el.getAttribute("url") &&
            (
              name === "thumbnail" ||
              (name === "content" &&
                (el.namespaceURI || "").includes("search.yahoo.com/mrss")) ||
              (name === "enclosure" && type.startsWith("image/"))
            );
        });

      return {
        title: field(item, "title"),
        link: atomLink
          ? atomLink.getAttribute("href")
          : field(item, "link"),
        category: category
          ? category.getAttribute("term") ||
            category.textContent.trim() || "General"
          : "General",
        excerpt: info.excerpt,
        image: media ? media.getAttribute("url") : info.image
      };
    });
  }

  function buildCard(post) {
    const card = document.createElement("article");
    card.className = "post-card";

    const link = document.createElement("a");
    link.className = "post-link";
    link.href = safeUrl(post.link) || FEED;
    link.target = "_blank";
    link.rel = "noopener noreferrer";

    const imageWrap = document.createElement("div");
    imageWrap.className = "image-wrap";

    const imageUrl = post.image ? safeUrl(post.image) : "";

    if (imageUrl) {
      const image = document.createElement("img");
      image.src = imageUrl;
      image.alt = "";
      image.loading = "lazy";
      image.addEventListener("error", () => image.remove());
      imageWrap.appendChild(image);
    }

    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = post.category || "General";
    imageWrap.appendChild(badge);

    const content = document.createElement("div");
    content.className = "content";

    const title = document.createElement("h3");
    title.className = "title";
    title.textContent = post.title;

    const excerpt = document.createElement("p");
    excerpt.className = "excerpt";
    excerpt.textContent = post.excerpt;

    content.append(title, excerpt);
    link.append(imageWrap, content);
    card.appendChild(link);

    return card;
  }

  const loaders = [
    // Primero intenta leer el RSS directamente.
    async () => parseXML(await get(FEED)),

    // Alternativa si el servidor no permite la lectura directa.
    async () => {
      const data = await get(
        "https://api.rss2json.com/v1/api.json?rss_url=" +
        encodeURIComponent(FEED),
        true
      );

      if (data.status !== "ok" || !data.items?.length) {
        throw new Error(data.message || "No se pudo convertir el RSS");
      }

      return data.items.slice(0, MAX_POSTS).map(item => {
        const info = contentInfo(item.content || item.description);
        return {
          title: item.title || "",
          link: item.link || "",
          category: item.categories?.[0] || "General",
          excerpt: info.excerpt,
          image: item.thumbnail || info.image ||
            (item.enclosure?.type?.startsWith("image/")
              ? item.enclosure.link : "")
        };
      });
    }
  ];

  for (const loader of loaders) {
    try {
      const posts = await loader();
      LIST.replaceChildren(...posts.map(buildCard));
      return;
    } catch (error) {
      console.warn("Error al cargar el blog:", error);
    }
  }

  LIST.textContent = "";
  ERROR.textContent =
    "No se pudieron cargar las publicaciones. Visita tuasesorprofesional.com.";
  ERROR.hidden = false;
})();
</script>
</body>
</html>
